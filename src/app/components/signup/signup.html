<form class="form" id="inscription-form">
    <h2>Inscrption</h2>
    <!-- Boite spéciale pour regrouper des champs de formulaire liés -->
    <fieldset class="signup-fieldset">
        <!-- Titre de cette boite -->
        <legend class="signup-legend">Informations Personnelles</legend>

        <div>
            <!-- for : indique à quel élément le label est associé -->
            <!-- id : donne l'identifiant de cet element -->
            <!-- for et id travaillent ensemble pour relier le label à son champ -->
            <label for="nom">Nom :</label>
            <input type="text" class="nom" id="nom" placeholder="Votre Nom" required>
        </div>

        <div>
            <label for="email">Email :</label>
            <input type="email" id="email" placeholder="exemple@gmail.com" required>
        </div>

        <div>
            <label for="pwd">Mot de passe :</label>
            <input type="password" id="pwd" placeholder="Votre mot de passe" required>
        </div>
    </fieldset>

    <!-- <fieldset class="signup-fieldset"> -->
    <!-- <legend class="signup-legend">Informations Supplémentaires</legend> -->

    <!-- Radio -->
    <fieldset class="signup-fieldset">
        <legend class="signup-legend">Genre :</legend>

        <input type="radio" id="femme" name="genre" value="femme">
        <label for="femme">Femme</label>

        <input type="radio" id="homme" name="genre" value="homme">
        <label for="homme">Homme</label>

        <input type="radio" id="autre" name="genre" value="autre">
        <label for="autre">Autre</label>
    </fieldset>

    <!-- checkbox -->
    <fieldset class="signup-fieldset">
        <legend class="signup-legend"> Intérets : </legend>

        <input type="checkbox" name="interets" id="vetements" value="vetements">
        <label for="vetements"> Vetements </label>

        <input type="checkbox" name="interets" id="accessoires" value="accessoires">
        <label for="accessoires"> Accessoires </label>
    </fieldset>

    <!-- Liste déroulante  -->
    <div>
        <label for="pays">Pays :</label>
        <select name="pays" id="pays">
            <option value="france">France</option>
            <option value="tunisie">Tunisie</option>
        </select>
    </div>
    <!-- </fieldset> -->
    <button type="submit">S'inscrire</button>
</form>
