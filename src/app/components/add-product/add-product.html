<form id="formProduct" class="form">
    <h2>Ajout Produit</h2>

    <div>
        <label for="nom">Nom :</label>
        <input type="text" id="nom" placeholder="Le nom de votre produit" required>
    </div>

    <div>
        <label for="prix">Prix :</label>
        <input type="number" id="prix" required>
    </div>
    <div>
        <label for="descirption">descirption :</label>
        <textarea rows="2" id="descirption" placeholder="Votre message" required></textarea>
    </div>
    <div>
        <label for="imgURL">ImgURL :</label>
        <input type="text" id="imgURL" placeholder="L'img de votre produit" required>
    </div>

    <button type="submit">Ajouter</button>
</form>
