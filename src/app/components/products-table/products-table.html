
@if (isConnected) {
<div>
    Bonjour Islem!
</div>
}
<table class="table table-hover">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nom</th>
            <th scope="col">Description</th>
            <th scope="col">Prix</th>
            <th scope="col">Actions</th>
        </tr>
    </thead>
    <tbody>
        <!-- product ou elt var qui répresente un prod à chaque tour  -->
        <!-- of Permet de parcourir le tableau -->
        <!-- productsTab : Tableau à parcourir -->
        <!-- track product.id : Permet à Angular d'identifier chaque produit grace à son id -->
        <!-- let i=$index : Permet de récupérer l'index (position) de chaque élement du tableau -->
        @for(product of productsTab; track product.id; let i=$index ){
        <tr>
            <th scope="row">{{ product.id }}</th>
            <td>{{ product.name }}</td>
            <td>{{ product.description }}</td>
            <td>{{ product.price }}£</td>
            <td>
                <button type="button" class="btn btn-primary" (click)="display(product.id)" >Voir Details</button>
                <button type="button" class="btn btn-success" (click)="goToEdit(product.id)">Modifier</button>
                <button type="button" class="btn btn-danger" (click)="deleteproduct(product.id)">Supprimer</button>
            </td>
        </tr>
        }
    </tbody>
</table>
